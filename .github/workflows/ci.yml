name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore EDealBuy.slnx
      - run: dotnet build EDealBuy.slnx -c Release --no-restore
      - run: dotnet test EDealBuy.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ../TestResults
      - name: Falla si hay paquetes vulnerables (directos y transitivos)
        shell: bash
        run: |
          dotnet list EDealBuy.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then exit 1; fi
      - name: SBOM (CycloneDX)
        shell: bash
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX EDealBuy.slnx -o ../sbom -fn backend.bom.json -F Json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-sbom-and-coverage
          path: |
            sbom
            TestResults

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false
      - name: Auditoría de dependencias (severidad alta o crítica)
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Puertas de calidad del Anexo C: duplicación < 3 % y tamaño de archivo del frontend.
  # Los límites de archivo (500) y método (60) del backend los aplica el compilador (SonarLint.xml).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-file-size.mjs
      - name: Duplicación de código (umbral en .jscpd.json)
        run: npx --yes jscpd@5.4.3 .
